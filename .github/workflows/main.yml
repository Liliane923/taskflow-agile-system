name: Node.js CI

on:
  push:
    branches: [ "Principal" ]
  pull_request:
    branches: [ "Principal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-size: 20
        
    - run: npm ci
    
    - name: Run Tests
      run: npm test
